name: Lấy nến Binance (tạm)
on:
  push:
    branches: [bn-data]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node research/bn-fetch.mjs
      - name: Lưu vào nhánh bn-klines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b bn-klines
          git add -A
          git -c user.name="bot-trade" -c user.email="bot-trade@users.noreply.github.com" commit -qm "nến Binance $(date -u +%F-%H%M)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bn-klines
