name: store-test
on: { push: { branches: [store-1125] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: thu ntfy
        run: |
          mkdir -p out
          exec > out/ket-qua.txt 2>&1
          TOPIC="botrade-test-$(date +%s)-ab12cd"
          echo "topic=$TOPIC"
          echo ""
          echo "=== 1. gui 3 tin (nhu app gui 3 lenh ve mot duong) ==="
          for i in 1 2 3; do
            curl -s -o /dev/null -w "gui $i -> %{http_code}\n" \
              -X POST "https://ntfy.sh/$TOPIC" \
              -H 'Content-Type: application/json' \
              -d "{\"id\":\"cmd$i\",\"act\":\"add\",\"coin\":\"WLD-USDT-SWAP\",\"n\":$i}"
          done
          sleep 3
          echo ""
          echo "=== 2. bot doc lai toan bo (poll since=all) ==="
          curl -s -w "\n[status %{http_code}]\n" "https://ntfy.sh/$TOPIC/json?poll=1&since=all"
          echo ""
          echo "=== 3. doc chi tin moi (since=10s) ==="
          curl -s "https://ntfy.sh/$TOPIC/json?poll=1&since=10s" | head -5
          echo ""
          echo "=== 4. gioi han kich thuoc than tin ==="
          python3 -c "import json;print(json.dumps({'id':'big','pad':'x'*3500}))" > /tmp/big.json
          curl -s -o /dev/null -w "than 3,5KB -> %{http_code}\n" -X POST "https://ntfy.sh/$TOPIC" --data-binary @/tmp/big.json
          python3 -c "import json;print(json.dumps({'id':'huge','pad':'x'*9000}))" > /tmp/huge.json
          curl -s -o /dev/null -w "than 9KB   -> %{http_code}\n" -X POST "https://ntfy.sh/$TOPIC" --data-binary @/tmp/huge.json
          echo ""
          echo "=== 5. CORS cho POST tu trang github.io ==="
          curl -s -D - -o /dev/null -X OPTIONS "https://ntfy.sh/$TOPIC" \
            -H 'Origin: https://duylong06.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' | tr -d '\r' | grep -i 'http/\|access-control'
      - name: day ket qua
        if: always()
        run: |
          git config user.name bot; git config user.email bot@local
          git checkout -q --orphan store-data2
          git rm -rq --cached . || true
          find . -maxdepth 1 ! -name . ! -name .git ! -name out -exec rm -rf {} +
          git add -f out/ket-qua.txt && git commit -qm "ket qua ntfy"
          git push -q -f origin store-data2
