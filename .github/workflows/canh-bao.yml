name: Cảnh báo sắp phá vỡ

on:
  schedule:
    # Chạy vào phút thứ 2 mỗi giờ (UTC) — ngay sau khi nến H1 đóng.
    # Lưu ý: cron của GitHub thường trễ 3-15 phút khi hệ thống bận.
    - cron: '2 * * * *'
  workflow_dispatch:        # cho phép bấm chạy tay để thử

concurrency:
  group: canh-bao
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Nhớ các tín hiệu đã báo để không gửi trùng.
      # Dùng cache thay vì commit ngược vào repo cho đỡ rác lịch sử commit.
      - name: Khôi phục bộ nhớ chống trùng
        uses: actions/cache/restore@v4
        with:
          path: alert/state.json
          key: nbk-state-${{ github.run_id }}
          restore-keys: nbk-state-

      - name: Quét
        env:
          TG_TOKEN:  ${{ secrets.TG_TOKEN }}
          TG_CHAT:   ${{ secrets.TG_CHAT }}
          NB_TF:     '1H'              # khung cấu trúc
          NB_TRIG:   '1H'              # khung nến kích hoạt ('same' = giống NB_TF)
          NB_VOL:    '2'               # volume tối thiểu so với trung bình 20 nến
          NB_SCOPE:  'liquid'          # top | liquid | all | new
          NB_DIR:    'both'            # both | long | short
          NB_TIERS:  'broken,near'     # bỏ 'near' nếu chỉ muốn tín hiệu đã xác nhận
          NB_MAXAGE: '0'               # 0 = chỉ nến vừa đóng
        run: node alert/scan.mjs

      - name: Lưu bộ nhớ chống trùng
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alert/state.json
          key: nbk-state-${{ github.run_id }}
