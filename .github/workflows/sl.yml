# Nhánh tạm: lấy lịch sử H1 để kiểm chứng cách đặt SL khi phá trendline. Không liên quan bot.
name: Đếm coin futures (tạm)
on:
  push:
    branches: [sl-1115]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node research/dem.mjs
      - name: Lưu vào nhánh sl-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b sl-data
          git add -A
          git -c user.name="bot-trade" -c user.email="bot-trade@users.noreply.github.com" commit -qm "đếm coin $(date -u +%F-%H%M)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sl-data
