# Bot thông báo Kèo Pro: quét M30 + H1 + H4 cho BTC / ETH / SOL / BNB, đẩy kèo hạng A+ và A về iPhone.
name: Kèo Pro — thông báo

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scan = quét và báo · test-push = gửi tin thử · dry-run = quét, in ra, không gửi · reset-open = xoá kèo đang giữ'
        type: choice
        options: [scan, test-push, dry-run, reset-open]
        default: scan
      grades:
        description: 'hạng được đẩy'
        type: choice
        options: ['A+,A', 'A+']
        default: 'A+,A'
  # Lịch dự phòng. GitHub BỎ gần hết lịch: repo này đặt 2 lượt/giờ mà thực tế chỉ chạy
  # 1 trong 17 lượt. Đặt 4 lượt/giờ cho tăng cơ hội, và bot tự soi lại vài nến đã đóng
  # (TFS[].back) nên lượt chạy trễ vẫn bắt được kèo. Muốn đúng giờ thì dùng cron-job.org
  # gọi workflow_dispatch — xem README.
  schedule:
    - cron: '1,16,31,46 * * * *'

concurrency:
  group: keo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund web-push@3.6.7
      - name: Quét và báo
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          MODE: ${{ github.event.inputs.mode || 'scan' }}
          GRADES: ${{ github.event.inputs.grades || 'A+,A' }}
        run: node bot/keo.mjs
      - name: Lưu trạng thái vào nhánh data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d out ] || exit 0
          cd out
          git init -q -b data
          git add -A
          git -c user.name="bot-trade" -c user.email="bot-trade@users.noreply.github.com" commit -qm "trạng thái Kèo Pro $(date -u +%F-%H%M)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
